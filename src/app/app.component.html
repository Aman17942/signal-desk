<ng-container *ngIf="isAuthenticated; else unauthenticated">
  <mat-drawer-container class="signal-shell">
    <mat-drawer
      mode="side"
      [opened]="sideBarOpen"
      class="signal-sidebar"
    >
      <app-sidebar></app-sidebar>
    </mat-drawer>

    <mat-drawer-content class="signal-shell__body">
      <app-header [isAuthMode]="false"></app-header>

      <main class="signal-shell__content">
        <div id="page-top"></div>
        <router-outlet></router-outlet>
      </main>
    </mat-drawer-content>
  </mat-drawer-container>
</ng-container>

<ng-template #unauthenticated>
  <div class="signal-auth">
    <app-header [isAuthMode]="true"></app-header>

    <main class="signal-auth__main">
      <router-outlet></router-outlet>
    </main>
  </div>
</ng-template>
