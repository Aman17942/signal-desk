<mat-card-content class="inc-feed__body">
  <mat-list class="inc-feed__list">
    <mat-list-item
      class="inc-feed__row"
      *ngFor="let item of builtIncidents"
      (click)="selectIncident(item)"
    >
      <div class="inc-feed__item">
        <span
          class="inc-feed__bar"
          [style.backgroundColor]="item.barColor"
        ></span>

        <span class="inc-feed__code">{{ item.code }}</span>
        <span class="inc-feed__title">{{ item.title }}</span>

        <mat-chip
          class="inc-feed__chip"
          [style.--inc-chip-color]="item.severityColor"
          disableRipple
        >
          {{ item.severity }}
        </mat-chip>

        <span class="inc-feed__service">{{ item.service }}</span>
        <span class="inc-feed__time">{{ item.timestamp }}</span>

        <mat-chip
          class="inc-feed__chip"
          [style.--inc-chip-color]="item.statusColor"
          disableRipple
        >
          {{ item.status }}
        </mat-chip>
      </div>
    </mat-list-item>
  </mat-list>
</mat-card-content>
