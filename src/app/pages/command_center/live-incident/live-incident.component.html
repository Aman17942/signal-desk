<mat-card-content class="inc-feed__body">
  <mat-list class="inc-feed__list">
    <mat-list-item
      class="inc-feed__row"
      *ngFor="let element of builtIncidents"
      (click)="selectIncident(element)"
    >
      <div class="inc-feed__item">
        <span
          class="inc-feed__bar"
          [style.backgroundColor]="element.barColor"
        ></span>

        <span class="inc-feed__code">{{ element.code }}</span>
        <span class="inc-feed__title">{{ element.title }}</span>

        <mat-chip
          class="inc-feed__chip"
          [style.--inc-chip-color]="element.severityColor"
          disableRipple
        >
          {{ element.severity }}
        </mat-chip>

        <span class="inc-feed__service">{{ element.service }}</span>
        <span class="inc-feed__time">{{ element.timestamp }}</span>

        <mat-chip
          class="inc-feed__chip"
          [style.--inc-chip-color]="element.statusColor"
          disableRipple
        >
          {{ element.status }}
        </mat-chip>
      </div>
    </mat-list-item>
  </mat-list>
</mat-card-content>
