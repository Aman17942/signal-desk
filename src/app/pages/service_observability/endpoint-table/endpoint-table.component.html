<mat-card-content class="ep-table__body">
  <table mat-table [dataSource]="dataSource" class="ep-table__grid">
    <ng-container matColumnDef="endpoint">
      <th mat-header-cell *matHeaderCellDef>Endpoint</th>
      <td mat-cell *matCellDef="let element" class="ep-table__endpoint">
        {{ element.endpoint }}
      </td>
    </ng-container>

    <ng-container matColumnDef="method">
      <th mat-header-cell *matHeaderCellDef>Method</th>
      <td mat-cell *matCellDef="let element">
        <mat-chip
          class="ep-table__method-chip"
          [style.--ep-method-color]="element.methodColor"
          disableRipple
        >
          {{ element.method }}
        </mat-chip>
      </td>
    </ng-container>
    <ng-container matColumnDef="throughput">
      <th mat-header-cell *matHeaderCellDef>Throughput</th>
      <td mat-cell *matCellDef="let element" class="ep-table__metric">
        {{ element.throughput }}
      </td>
    </ng-container>

    <ng-container matColumnDef="p95Latency">
      <th mat-header-cell *matHeaderCellDef>P95 Latency</th>
      <td mat-cell *matCellDef="let element" class="ep-table__metric">
        {{ element.p95Latency }}
      </td>
    </ng-container>

    <ng-container matColumnDef="p99Latency">
      <th mat-header-cell *matHeaderCellDef>P99 Latency</th>
      <td mat-cell *matCellDef="let element" class="ep-table__metric">
        {{ element.p99Latency }}
      </td>
    </ng-container>

    <ng-container matColumnDef="errorRate">
      <th mat-header-cell *matHeaderCellDef>Error Rate</th>
      <td
        mat-cell
        *matCellDef="let element"
        class="ep-table__error"
        [class.ep-table__error--high]="element.isHighError"
      >
        {{ element.errorRate }}
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr
      mat-row
      *matRowDef="let row; columns: displayedColumns;"
      class="ep-table__row"
      (click)="onRowClick(row)"
    ></tr>
  </table>
</mat-card-content>
